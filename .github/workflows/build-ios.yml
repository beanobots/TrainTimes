name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the latest build as a release

env:
  # Each build gets its own number, so AltStore can tell a new build is an update
  VERSION: 1.0.${{ github.run_number }}
  BUILD: ${{ github.run_number }}
  RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/latest

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build, unsigned (AltStore signs it on your computer)
        working-directory: ios
        run: |
          xcodebuild \
            -project NextRTrain.xcodeproj \
            -scheme NextRTrain \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Add the App Group entitlement
        # The build is unsigned, but AltStore reads each app's entitlements to set up
        # the App Group the app and widget share. An ad-hoc signature carries them;
        # AltStore replaces the signature when it installs.
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/NextRTrain.app
          codesign --force --sign - --timestamp=none --entitlements Config/Widget.entitlements "$APP/PlugIns/RTrainWidget.appex"
          codesign --force --sign - --timestamp=none --entitlements Config/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -A2 application-groups
          codesign -d --entitlements - "$APP/PlugIns/RTrainWidget.appex" 2>&1 | grep -A2 application-groups

      - name: Package the .ipa
        working-directory: ios
        run: |
          rm -rf Payload TrainTimes.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NextRTrain.app Payload/
          # the widget must be inside the app, with the station and elevator lists in both
          test -d Payload/NextRTrain.app/PlugIns/RTrainWidget.appex
          test -f Payload/NextRTrain.app/stations.json
          test -f Payload/NextRTrain.app/PlugIns/RTrainWidget.appex/stations.json
          test -f Payload/NextRTrain.app/equipment.json
          test -f Payload/NextRTrain.app/PlugIns/RTrainWidget.appex/equipment.json
          # and every line's icon, for the app to switch to
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:AppIcon-SI" Payload/NextRTrain.app/Info.plist
          zip -qr TrainTimes.ipa Payload

      - name: Write the AltStore source
        # source.json describes the .ipa (version, size, entitlements), read from the
        # .ipa itself so AltStore's checks pass. Add its URL in AltStore to install
        # and get updates.
        run: |
          python3 tools/make_altstore_source.py ios/TrainTimes.ipa ios/source.json \
            --download-url "$RELEASE_URL/TrainTimes.ipa" \
            --icon-url "$RELEASE_URL/icon.png" \
            --notes "Build $BUILD, from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          cp ios/App/Assets.xcassets/AppIcon.appiconset/icon.png ios/icon.png
          python3 -c "import json; s = json.load(open('ios/source.json')); v = s['apps'][0]['versions'][0]; assert v['version'] == '$VERSION' and v['buildVersion'] == '$BUILD', v"

      - uses: actions/upload-artifact@v4
        with:
          name: TrainTimes-${{ env.VERSION }}
          path: |
            ios/TrainTimes.ipa
            ios/source.json

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ios/TrainTimes.ipa ios/source.json ios/icon.png \
            --target "$GITHUB_SHA" \
            --title "Train Times $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. In AltStore, add the source $RELEASE_URL/source.json, or install TrainTimes.ipa directly."
