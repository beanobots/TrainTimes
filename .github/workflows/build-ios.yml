name: Build iOS app

on:
  push:
    branches: [main]
    # Only a change to the app, or to how it's built and published, makes a
    # new version; run the workflow by hand on main to publish anyway. The
    # publish step looks for the same paths in later commits. build-server.yml
    # builds and tests the server.
    paths:
      - ios/**
      - tools/make_altstore_source.py
      - .github/workflows/build-ios.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for each kind of run and branch or pull request, so two
# pushes to main can't publish at once; a push's build that's still waiting
# gives way to a newer push's, never to a run started by hand. A newer push to
# a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each build gets its own number, so AltStore can tell a new build is an update
  VERSION: 1.0.${{ github.run_number }}
  BUILD: ${{ github.run_number }}
  # The latest release has the newest build's source.json, .ipa and icon
  RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/latest
  # Each build's own release keeps its .ipa, where its source.json points
  BUILD_URL: https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # to publish the latest build as a release
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build, unsigned (AltStore signs it on your computer)
        working-directory: ios
        run: |
          xcodebuild \
            -project NextRTrain.xcodeproj \
            -scheme NextRTrain \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Add the App Group entitlement
        # The build is unsigned, but AltStore reads each app's entitlements to set up
        # the App Group the app and widget share. An ad-hoc signature carries them;
        # AltStore replaces the signature when it installs.
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/NextRTrain.app
          codesign --force --sign - --timestamp=none --entitlements Config/Widget.entitlements "$APP/PlugIns/RTrainWidget.appex"
          codesign --force --sign - --timestamp=none --entitlements Config/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -A2 application-groups
          codesign -d --entitlements - "$APP/PlugIns/RTrainWidget.appex" 2>&1 | grep -A2 application-groups

      - name: Package the .ipa
        working-directory: ios
        run: |
          rm -rf Payload TrainTimes.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NextRTrain.app Payload/
          # the widget must be inside the app, with the station and elevator lists in both
          test -d Payload/NextRTrain.app/PlugIns/RTrainWidget.appex
          test -f Payload/NextRTrain.app/stations.json
          test -f Payload/NextRTrain.app/PlugIns/RTrainWidget.appex/stations.json
          test -f Payload/NextRTrain.app/equipment.json
          test -f Payload/NextRTrain.app/PlugIns/RTrainWidget.appex/equipment.json
          # and every line's icon for the app to switch to, as Lines.swift has
          # the lines (the R's is the main icon)
          labels=$(python3 ../tools/line_styles.py)
          for label in $labels; do
            if [ "$label" != R ]; then
              /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons:AppIcon-$label" Payload/NextRTrain.app/Info.plist >/dev/null
            fi
          done
          echo "Icons for $labels"
          zip -qr TrainTimes.ipa Payload

      - name: Write the AltStore source
        # source.json describes the .ipa (version, size, entitlements), read from the
        # .ipa itself so AltStore's checks pass, and downloads it from the build's
        # own release. Add its URL in AltStore to install and get updates.
        run: |
          python3 tools/make_altstore_source.py ios/TrainTimes.ipa ios/source.json \
            --download-url "$BUILD_URL/TrainTimes.ipa" \
            --icon-url "$RELEASE_URL/icon.png" \
            --notes "Build $BUILD, from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          cp ios/App/Assets.xcassets/AppIcon.appiconset/icon.png ios/icon.png
          python3 -c "import json; s = json.load(open('ios/source.json')); v = s['apps'][0]['versions'][0]; assert v['version'] == '$VERSION' and v['buildVersion'] == '$BUILD', v"

      - uses: actions/upload-artifact@v4
        with:
          name: TrainTimes-${{ env.VERSION }}
          path: |
            ios/TrainTimes.ipa
            ios/source.json

      - name: Publish as the latest release
        # A push to main publishes, and so does a run started by hand on main,
        # but only while main has the same app and no newer build is out, so an
        # older run, or a re-run of one, can't replace a newer build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main" != "$GITHUB_SHA" ]; then
            # Commits after this one that leave the app alone start no build
            # of their own, so this one publishes for them. One that changes
            # the paths the push trigger has starts its own build, which
            # publishes instead. A compare lists at most 300 files, so that
            # many counts as a change.
            later=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$main" --jq '
              [.status,
               ([(.files // [])[] | (.filename, .previous_filename // empty)
                 | select(startswith("ios/") or . == "tools/make_altstore_source.py" or . == ".github/workflows/build-ios.yml")]
                | length),
               (.files // [] | length)] | @tsv')
            read -r status app files <<< "$later"
            if [ "$status" != ahead ] || [ "$app" -gt 0 ] || [ "$files" -ge 300 ]; then
              echo "main has changed the app again by ${main::7}; not publishing ${GITHUB_SHA::7}"
              exit 0
            fi
            echo "main has moved on to ${main::7} without changing the app"
          fi
          if newest=$(gh release view latest --json name --jq '.name | split(".") | last' 2>/dev/null) &&
            [ "$newest" -gt "$BUILD" ] 2>/dev/null; then
            echo "Build $newest is already out; not publishing build $BUILD"
            exit 0
          fi
          # The build's own release, which its source.json downloads it from, so
          # an AltStore that read the source before the next build still gets the
          # build it describes. A re-run replaces its .ipa.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" ios/TrainTimes.ipa --clobber
          else
            gh release create "v$VERSION" ios/TrainTimes.ipa \
              --target "$GITHUB_SHA" \
              --title "Train Times $VERSION" \
              --notes "Built from ${GITHUB_SHA::7}."
          fi
          # Then the latest release takes its files, each replaced in place,
          # so the release itself is never gone. Its tag stays where it was
          # made, as this token may not move a tag past a change to the workflows.
          notes="Build $BUILD, from ${GITHUB_SHA::7} (its own release is v$VERSION). In AltStore, add the source $RELEASE_URL/source.json, or install TrainTimes.ipa directly."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ios/source.json ios/icon.png ios/TrainTimes.ipa --clobber
            gh release edit latest --title "Train Times $VERSION" --notes "$notes"
          else
            gh release create latest ios/source.json ios/icon.png ios/TrainTimes.ipa \
              --target "$GITHUB_SHA" \
              --title "Train Times $VERSION" \
              --notes "$notes"
          fi
