name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the latest build as a release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build, unsigned (AltStore signs it on your computer)
        working-directory: ios
        run: |
          xcodebuild \
            -project NextRTrain.xcodeproj \
            -scheme NextRTrain \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Add the App Group entitlement
        # The build is unsigned, but AltStore reads each app's entitlements to set up
        # the App Group the app and widget share. An ad-hoc signature carries them;
        # AltStore replaces the signature when it installs.
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/NextRTrain.app
          codesign --force --sign - --timestamp=none --entitlements Config/Widget.entitlements "$APP/PlugIns/RTrainWidget.appex"
          codesign --force --sign - --timestamp=none --entitlements Config/App.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | grep -A2 application-groups
          codesign -d --entitlements - "$APP/PlugIns/RTrainWidget.appex" 2>&1 | grep -A2 application-groups

      - name: Package the .ipa
        working-directory: ios
        run: |
          rm -rf Payload TrainTimes.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NextRTrain.app Payload/
          # the widget must be inside the app, with the station and elevator lists in both
          test -d Payload/NextRTrain.app/PlugIns/RTrainWidget.appex
          test -f Payload/NextRTrain.app/stations.json
          test -f Payload/NextRTrain.app/PlugIns/RTrainWidget.appex/stations.json
          test -f Payload/NextRTrain.app/equipment.json
          test -f Payload/NextRTrain.app/PlugIns/RTrainWidget.appex/equipment.json
          zip -qr TrainTimes.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NextRTrain-ipa
          path: ios/TrainTimes.ipa

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ios/TrainTimes.ipa \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Install it with AltStore."
