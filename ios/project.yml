# Describes the Xcode project; XcodeGen turns it into NextRTrain.xcodeproj on the
# build machine (see ../.github/workflows/build-ios.yml), so no .xcodeproj is stored.
name: NextRTrain
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NextRTrain:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - target: RTrainWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Next R Train
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rtrainwidget.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RTrainWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Next R Train
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rtrainwidget.app.widget
        SKIP_INSTALL: YES
