# Describes the Xcode project; XcodeGen turns it into NextRTrain.xcodeproj on the
# build machine (see ../.github/workflows/build-ios.yml), so no .xcodeproj is stored.
name: NextRTrain
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NextRTrain:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: RTrainWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Train Times
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # traintimes:// links, such as the widget's alert opening it in the app
        CFBundleURLTypes:
          - CFBundleURLName: Train Times
            CFBundleURLSchemes:
              - traintimes
        # The Lock Screen and Dynamic Island countdown
        NSSupportsLiveActivities: true
        # Stations near you, in the Live tab and on the Nearby widget
        NSLocationWhenInUseUsageDescription: Your location shows the stations near you and their next trains, in the app and on the Nearby widget.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    # The app and the widget share the chosen station through this App Group
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rtrainwidget.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rtrainwidget.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Code shared with the widget checks this: only the app may start or update Live Activities
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP
  RTrainWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Train Times
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # The Nearby widget finds you each time it reloads, with the app's
        # permission, which then reads "While Using the App or Widgets"
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: Your location shows the stations near you and their next trains, in the app and on the Nearby widget.
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.rtrainwidget.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rtrainwidget.app.widget
        SKIP_INSTALL: YES
